<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 490" width="740" height="490" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>Wiring: ESP32-C3 SuperMini to GC9A01 round display</title>
  <rect width="740" height="490" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="370" y="32" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">Wiring: ESP32-C3 SuperMini → GC9A01 round display (SPI)</text>
  <g transform="translate(0,50)">
  <!-- GC9A01 round display module (blue PCB, 7-pin header, no BLK) -->
  <circle cx="655" cy="212" r="80" fill="#1e4fb8" stroke="#163a8a" stroke-width="2"/>
  <rect x="520" y="88" width="76" height="248" rx="8" fill="#1e4fb8" stroke="#163a8a" stroke-width="2"/>
  <circle cx="570" cy="100" r="8" fill="#fff" stroke="#9aa4b2" stroke-width="2"/><circle cx="570" cy="100" r="4" fill="#163a8a"/>
  <circle cx="570" cy="324" r="8" fill="#fff" stroke="#9aa4b2" stroke-width="2"/><circle cx="570" cy="324" r="4" fill="#163a8a"/>
  <circle cx="655" cy="212" r="72" fill="#05070a" stroke="#0b0d10" stroke-width="2"/>
  <circle cx="655" cy="212" r="64" fill="none" stroke="#777" stroke-width="6" stroke-dasharray="1 5.4"/>
  <circle cx="655" cy="212" r="64" fill="none" stroke="#22d3ee" stroke-width="7" stroke-dasharray="2.5 30.5" transform="rotate(-92 655 212)"/>
  <text x="655" y="208" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">10:47</text>
  <text x="663" y="190" text-anchor="middle" font-size="9" fill="#22d3ee">Tue 23</text>
  <circle cx="631" cy="224" r="7" fill="#facc15"/><ellipse cx="633" cy="232" rx="10" ry="6" fill="#fff"/>
  <text x="669" y="234" text-anchor="middle" font-size="15" font-weight="700" fill="#ef4444">72°</text>
  <text x="653" y="252" text-anchor="middle" font-size="9" font-weight="700" fill="#2563eb">55%</text>
  <text x="542" y="124" font-size="12" font-weight="700" fill="#fff">RST</text>
  <circle cx="530" cy="120" r="5" fill="#d8dde3" stroke="#5b6573"/>
  <text x="542" y="154" font-size="12" font-weight="700" fill="#fff">CS</text>
  <circle cx="530" cy="150" r="5" fill="#d8dde3" stroke="#5b6573"/>
  <text x="542" y="184" font-size="12" font-weight="700" fill="#fff">DC</text>
  <circle cx="530" cy="180" r="5" fill="#d8dde3" stroke="#5b6573"/>
  <text x="542" y="214" font-size="12" font-weight="700" fill="#fff">SDA</text>
  <circle cx="530" cy="210" r="5" fill="#d8dde3" stroke="#5b6573"/>
  <text x="542" y="244" font-size="12" font-weight="700" fill="#fff">SCL</text>
  <circle cx="530" cy="240" r="5" fill="#d8dde3" stroke="#5b6573"/>
  <text x="542" y="274" font-size="12" font-weight="700" fill="#fff">GND</text>
  <circle cx="530" cy="270" r="5" fill="#d8dde3" stroke="#5b6573"/>
  <text x="542" y="304" font-size="12" font-weight="700" fill="#fff">VCC</text>
  <rect x="524" y="295" width="10" height="10" fill="#d8dde3" stroke="#5b6573"/>
  <!-- ESP32-C3 SuperMini, top view -->
  <rect x="110" y="60" width="200" height="305" rx="14" fill="#1b1b1f" stroke="#3a3a42"/>
  <rect x="177" y="46" width="66" height="30" rx="4" fill="#aab2bd"/>
  <text x="210" y="66" text-anchor="middle" font-size="10" fill="#1f2328">USB-C</text>
  <rect x="132" y="62" width="34" height="18" rx="3" fill="#d8dde3"/><text x="149" y="75" text-anchor="middle" font-size="9" fill="#1f2328">BOOT</text>
  <rect x="254" y="62" width="34" height="18" rx="3" fill="#d8dde3"/><text x="271" y="75" text-anchor="middle" font-size="9" fill="#1f2328">RST</text>
  <rect x="175" y="150" width="70" height="70" rx="3" fill="#aab2bd"/>
  <text x="210" y="188" text-anchor="middle" font-size="10" font-weight="700" fill="#1f2328">ESP32-C3</text>
  <text x="210" y="285" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">SuperMini</text>
  <text x="210" y="345" text-anchor="middle" font-size="10" fill="#9aa4b2">TOP VIEW</text>
  <circle cx="124" cy="90" r="6" fill="#d9b44a"/>
  <text x="138" y="94" font-size="12" fill="#fff" font-weight="700" opacity="1">5</text>
  <circle cx="124" cy="120" r="6" fill="#d9b44a"/>
  <text x="138" y="124" font-size="12" fill="#fff" font-weight="400" opacity="0.6">6</text>
  <circle cx="124" cy="150" r="6" fill="#d9b44a"/>
  <text x="138" y="154" font-size="12" fill="#fff" font-weight="400" opacity="0.6">7</text>
  <circle cx="124" cy="180" r="6" fill="#d9b44a"/>
  <text x="138" y="184" font-size="12" fill="#fff" font-weight="400" opacity="0.6">8</text>
  <circle cx="124" cy="210" r="6" fill="#d9b44a"/>
  <text x="138" y="214" font-size="12" fill="#fff" font-weight="400" opacity="0.6">9</text>
  <circle cx="124" cy="240" r="6" fill="#d9b44a"/>
  <text x="138" y="244" font-size="12" fill="#fff" font-weight="700" opacity="1">10</text>
  <circle cx="124" cy="270" r="6" fill="#d9b44a"/>
  <text x="138" y="274" font-size="12" fill="#fff" font-weight="400" opacity="0.6">20</text>
  <circle cx="124" cy="300" r="6" fill="#d9b44a"/>
  <text x="138" y="304" font-size="12" fill="#fff" font-weight="400" opacity="0.6">21</text>
  <circle cx="296" cy="90" r="6" fill="#d9b44a"/>
  <text x="282" y="94" text-anchor="end" font-size="12" fill="#fff" font-weight="700" opacity="1">5V</text>
  <circle cx="296" cy="120" r="6" fill="#d9b44a"/>
  <text x="282" y="124" text-anchor="end" font-size="12" fill="#fff" font-weight="700" opacity="1">G</text>
  <circle cx="296" cy="150" r="6" fill="#d9b44a"/>
  <text x="282" y="154" text-anchor="end" font-size="12" fill="#fff" font-weight="700" opacity="1">3V3</text>
  <circle cx="296" cy="180" r="6" fill="#d9b44a"/>
  <text x="282" y="184" text-anchor="end" font-size="12" fill="#fff" font-weight="700" opacity="1">4</text>
  <circle cx="296" cy="210" r="6" fill="#d9b44a"/>
  <text x="282" y="214" text-anchor="end" font-size="12" fill="#fff" font-weight="400" opacity="0.6">3</text>
  <circle cx="296" cy="240" r="6" fill="#d9b44a"/>
  <text x="282" y="244" text-anchor="end" font-size="12" fill="#fff" font-weight="400" opacity="0.6">2</text>
  <circle cx="296" cy="270" r="6" fill="#d9b44a"/>
  <text x="282" y="274" text-anchor="end" font-size="12" fill="#fff" font-weight="700" opacity="1">1</text>
  <circle cx="296" cy="300" r="6" fill="#d9b44a"/>
  <text x="282" y="304" text-anchor="end" font-size="12" fill="#fff" font-weight="700" opacity="1">0</text>
  <g fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M530 270 H440 V120 H296" stroke="#222222"/>
    <path d="M530 300 H490 V150 H296" stroke="#d62828"/>
    <path d="M530 150 H510 V45 H80 V90 H124" stroke="#2e9e4f"/>
    <path d="M530 210 H380 V180 H296" stroke="#2a7de1"/>
    <path d="M530 120 H470 V300 H296" stroke="#e67e22"/>
    <path d="M530 180 H410 V270 H296" stroke="#8e44ad"/>
    <path d="M530 240 H500 V30 H50 V240 H124" stroke="#e9a100"/>
  </g>
  <g font-size="10" fill="#57606a">
    <text x="300" y="144">power (3.3 V)</text>
    <text x="300" y="114">ground</text>
    <text x="300" y="174">SPI data (MOSI)</text>
    <text x="300" y="264">data / command</text>
    <text x="300" y="294">reset</text>
    <text x="285" y="24" text-anchor="middle">SPI clock</text><text x="285" y="39" text-anchor="middle">chip select</text>
  </g>
  </g>
  <text x="370" y="448" text-anchor="middle" font-size="11" fill="#57606a">This module has no BLK pin, so the backlight is always on. If yours has one, wire BLK to GPIO 3 and enable -DTFT_BL=3 in platformio.ini.</text>
  <text x="370" y="466" text-anchor="middle" font-size="11" fill="#57606a">Pin order on display modules varies, so match by label. Board shown is the ESP32-C3 SuperMini (top view), USB-C at the top.</text>
</svg>
