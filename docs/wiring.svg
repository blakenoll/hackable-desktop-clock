<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 490" width="740" height="490" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>Wiring: Lolin C3 Mini to GC9A01 round display</title>
  <rect width="740" height="490" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="370" y="32" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">Wiring: GC9A01 round display → Lolin C3 Mini (SPI)</text>
  <g transform="translate(0,50)">
  <rect x="20" y="60" width="190" height="300" rx="10" fill="#1f2a37"/>
  <text x="115" y="84" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">GC9A01</text>
  <circle cx="88" cy="215" r="62" fill="#0b0d10" stroke="#5b6573" stroke-width="4"/>
  <text x="88" y="219" text-anchor="middle" font-size="10" fill="#9aa4b2">240×240</text>
  <text x="198" y="124" text-anchor="end" font-size="12" font-weight="600" fill="#fff">GND</text>
  <circle cx="210" cy="120" r="5" fill="#fff" stroke="#5b6573"/>
  <text x="198" y="154" text-anchor="end" font-size="12" font-weight="600" fill="#fff">SCL</text>
  <circle cx="210" cy="150" r="5" fill="#fff" stroke="#5b6573"/>
  <text x="198" y="184" text-anchor="end" font-size="12" font-weight="600" fill="#fff">DC</text>
  <circle cx="210" cy="180" r="5" fill="#fff" stroke="#5b6573"/>
  <text x="198" y="214" text-anchor="end" font-size="12" font-weight="600" fill="#fff">RST</text>
  <circle cx="210" cy="210" r="5" fill="#fff" stroke="#5b6573"/>
  <text x="198" y="244" text-anchor="end" font-size="12" font-weight="600" fill="#fff">SDA</text>
  <circle cx="210" cy="240" r="5" fill="#fff" stroke="#5b6573"/>
  <text x="198" y="274" text-anchor="end" font-size="12" font-weight="600" fill="#fff">CS</text>
  <circle cx="210" cy="270" r="5" fill="#fff" stroke="#5b6573"/>
  <text x="198" y="304" text-anchor="end" font-size="12" font-weight="600" fill="#fff">VCC</text>
  <circle cx="210" cy="300" r="5" fill="#fff" stroke="#5b6573"/>
  <text x="198" y="334" text-anchor="end" font-size="12" font-weight="600" fill="#fff" opacity=".55">BLK</text>
  <circle cx="210" cy="330" r="5" fill="#fff" stroke="#5b6573" opacity=".55"/>
  <rect x="430" y="60" width="200" height="305" rx="22" fill="#3b2149"/>
  <circle cx="455" cy="80" r="0" fill="none"/>
  <rect x="505" y="150" width="50" height="50" rx="3" fill="#15171a"/>
  <text x="530" y="180" text-anchor="middle" font-size="9" fill="#9aa4b2">ESP32-C3</text>
  <text x="530" y="250" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">C3 Mini</text>
  <rect x="497" y="335" width="66" height="30" rx="4" fill="#aab2bd"/>
  <text x="530" y="354" text-anchor="middle" font-size="10" fill="#1f2328">USB-C</text>
  <rect x="446" y="338" width="30" height="20" rx="3" fill="#d8dde3"/><text x="461" y="352" text-anchor="middle" font-size="9" fill="#1f2328">RST</text>
  <rect x="584" y="338" width="30" height="20" rx="3" fill="#d8dde3"/><text x="599" y="352" text-anchor="middle" font-size="9" fill="#1f2328">BOOT</text>
  <circle cx="444" cy="90" r="6" fill="#d9b44a"/>
  <text x="458" y="94" font-size="12" fill="#fff" font-weight="400" opacity="0.6">EN</text>
  <circle cx="444" cy="120" r="6" fill="#d9b44a"/>
  <text x="458" y="124" font-size="12" fill="#fff" font-weight="400" opacity="0.6">3 (BLK)</text>
  <circle cx="444" cy="150" r="6" fill="#d9b44a"/>
  <text x="458" y="154" font-size="12" fill="#fff" font-weight="400" opacity="0.6">2</text>
  <circle cx="444" cy="180" r="6" fill="#d9b44a"/>
  <text x="458" y="184" font-size="12" fill="#fff" font-weight="700" opacity="1">1</text>
  <circle cx="444" cy="210" r="6" fill="#d9b44a"/>
  <text x="458" y="214" font-size="12" fill="#fff" font-weight="700" opacity="1">0</text>
  <circle cx="444" cy="240" r="6" fill="#d9b44a"/>
  <text x="458" y="244" font-size="12" fill="#fff" font-weight="700" opacity="1">4</text>
  <circle cx="444" cy="270" r="6" fill="#d9b44a"/>
  <text x="458" y="274" font-size="12" fill="#fff" font-weight="700" opacity="1">5</text>
  <circle cx="444" cy="300" r="6" fill="#d9b44a"/>
  <text x="458" y="304" font-size="12" fill="#fff" font-weight="700" opacity="1">3V3</text>
  <circle cx="616" cy="90" r="6" fill="#d9b44a"/>
  <text x="602" y="94" text-anchor="end" font-size="12" fill="#fff" font-weight="400" opacity="0.6">21 TX</text>
  <circle cx="616" cy="120" r="6" fill="#d9b44a"/>
  <text x="602" y="124" text-anchor="end" font-size="12" fill="#fff" font-weight="400" opacity="0.6">20 RX</text>
  <circle cx="616" cy="150" r="6" fill="#d9b44a"/>
  <text x="602" y="154" text-anchor="end" font-size="12" fill="#fff" font-weight="700" opacity="1">10</text>
  <circle cx="616" cy="180" r="6" fill="#d9b44a"/>
  <text x="602" y="184" text-anchor="end" font-size="12" fill="#fff" font-weight="400" opacity="0.6">8</text>
  <circle cx="616" cy="210" r="6" fill="#d9b44a"/>
  <text x="602" y="214" text-anchor="end" font-size="12" fill="#fff" font-weight="400" opacity="0.6">7</text>
  <circle cx="616" cy="240" r="6" fill="#d9b44a"/>
  <text x="602" y="244" text-anchor="end" font-size="12" fill="#fff" font-weight="400" opacity="0.6">6</text>
  <circle cx="616" cy="270" r="6" fill="#d9b44a"/>
  <text x="602" y="274" text-anchor="end" font-size="12" fill="#fff" font-weight="700" opacity="1">GND</text>
  <circle cx="616" cy="300" r="6" fill="#d9b44a"/>
  <text x="602" y="304" text-anchor="end" font-size="12" fill="#fff" font-weight="400" opacity="0.6">VBUS</text>
  <circle cx="444" cy="120" r="9" fill="none" stroke="#fff" stroke-dasharray="3 3" opacity=".7"/>
  <g fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M210 300 H444" stroke="#d62828"/>
    <path d="M210 270 H444" stroke="#2e9e4f"/>
    <path d="M210 240 H444" stroke="#2a7de1"/>
    <path d="M210 210 H444" stroke="#e67e22"/>
    <path d="M210 180 H444" stroke="#8e44ad"/>
    <path d="M210 150 H240 V40 H670 V150 H616" stroke="#e9a100"/>
    <path d="M210 120 H225 V25 H700 V270 H616" stroke="#222222"/>
  </g>
  <g font-size="10" fill="#57606a" text-anchor="middle">
    <text x="327" y="294">power (3.3 V)</text>
    <text x="327" y="264">chip select</text>
    <text x="327" y="234">SPI data (MOSI)</text>
    <text x="327" y="204">reset</text>
    <text x="327" y="174">data / command</text>
    <text x="455" y="35">SPI clock</text><text x="455" y="19">ground</text>
  </g>
  </g>
  <text x="370" y="448" text-anchor="middle" font-size="11" fill="#57606a">BLK (backlight) is optional: if your module has it, wire it to GPIO 3 (dashed) and enable -DTFT_BL=3 in platformio.ini.</text>
  <text x="370" y="466" text-anchor="middle" font-size="11" fill="#57606a">Pin order on display modules varies, so match by label. Board shown is the Lolin C3 Mini v2.1.0, USB-C at the bottom.</text>
</svg>