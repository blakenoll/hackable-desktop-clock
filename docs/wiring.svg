<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 490" width="740" height="490" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>Wiring: ESP32-C3 SuperMini to GC9A01 round display</title>
  <rect width="740" height="490" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="370" y="32" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">Wiring: GC9A01 round display → ESP32-C3 SuperMini (SPI)</text>
  <g transform="translate(0,50)">
  <rect x="20" y="60" width="190" height="300" rx="10" fill="#1f2a37"/>
  <text x="115" y="84" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">GC9A01</text>
  <circle cx="88" cy="215" r="62" fill="#0b0d10" stroke="#5b6573" stroke-width="4"/>
  <text x="88" y="219" text-anchor="middle" font-size="10" fill="#9aa4b2">240×240</text>
  <text x="198" y="124" text-anchor="end" font-size="12" font-weight="600" fill="#fff">GND</text>
  <circle cx="210" cy="120" r="5" fill="#fff" stroke="#5b6573"/>
  <text x="198" y="154" text-anchor="end" font-size="12" font-weight="600" fill="#fff">SCL</text>
  <circle cx="210" cy="150" r="5" fill="#fff" stroke="#5b6573"/>
  <text x="198" y="184" text-anchor="end" font-size="12" font-weight="600" fill="#fff">DC</text>
  <circle cx="210" cy="180" r="5" fill="#fff" stroke="#5b6573"/>
  <text x="198" y="214" text-anchor="end" font-size="12" font-weight="600" fill="#fff">RST</text>
  <circle cx="210" cy="210" r="5" fill="#fff" stroke="#5b6573"/>
  <text x="198" y="244" text-anchor="end" font-size="12" font-weight="600" fill="#fff">SDA</text>
  <circle cx="210" cy="240" r="5" fill="#fff" stroke="#5b6573"/>
  <text x="198" y="274" text-anchor="end" font-size="12" font-weight="600" fill="#fff">CS</text>
  <circle cx="210" cy="270" r="5" fill="#fff" stroke="#5b6573"/>
  <text x="198" y="304" text-anchor="end" font-size="12" font-weight="600" fill="#fff">VCC</text>
  <circle cx="210" cy="300" r="5" fill="#fff" stroke="#5b6573"/>
  <text x="198" y="334" text-anchor="end" font-size="12" font-weight="600" fill="#fff" opacity=".55">BLK</text>
  <circle cx="210" cy="330" r="5" fill="#fff" stroke="#5b6573" opacity=".55"/>
  <rect x="430" y="60" width="200" height="305" rx="14" fill="#1b1b1f" stroke="#3a3a42"/>
  <rect x="497" y="46" width="66" height="30" rx="4" fill="#aab2bd"/>
  <text x="530" y="66" text-anchor="middle" font-size="10" fill="#1f2328">USB-C</text>
  <rect x="490" y="150" width="80" height="22" rx="2" fill="#f2f2f2"/>
  <text x="530" y="165" text-anchor="middle" font-size="11" font-weight="700" fill="#111">HW-466AB</text>
  <rect x="480" y="215" width="100" height="22" rx="2" fill="#f2f2f2"/>
  <text x="530" y="230" text-anchor="middle" font-size="11" font-weight="700" fill="#111">ESP32-C3</text>
  <rect x="480" y="260" width="100" height="22" rx="2" fill="#f2f2f2"/>
  <text x="530" y="275" text-anchor="middle" font-size="11" font-weight="700" fill="#111">SuperMini</text>
  <text x="530" y="345" text-anchor="middle" font-size="10" fill="#9aa4b2">BACK VIEW</text>
  <circle cx="444" cy="90" r="6" fill="#d9b44a"/>
  <text x="458" y="94" font-size="12" fill="#fff" font-weight="700" opacity="1">5V</text>
  <circle cx="444" cy="120" r="6" fill="#d9b44a"/>
  <text x="458" y="124" font-size="12" fill="#fff" font-weight="700" opacity="1">G</text>
  <circle cx="444" cy="150" r="6" fill="#d9b44a"/>
  <text x="458" y="154" font-size="12" fill="#fff" font-weight="700" opacity="1">3V3</text>
  <circle cx="444" cy="180" r="6" fill="#d9b44a"/>
  <text x="458" y="184" font-size="12" fill="#fff" font-weight="700" opacity="1">4</text>
  <circle cx="444" cy="210" r="6" fill="#d9b44a"/>
  <text x="458" y="214" font-size="12" fill="#fff" font-weight="700" opacity="1">3</text>
  <circle cx="444" cy="240" r="6" fill="#d9b44a"/>
  <text x="458" y="244" font-size="12" fill="#fff" font-weight="400" opacity="0.6">2</text>
  <circle cx="444" cy="270" r="6" fill="#d9b44a"/>
  <text x="458" y="274" font-size="12" fill="#fff" font-weight="700" opacity="1">1</text>
  <circle cx="444" cy="300" r="6" fill="#d9b44a"/>
  <text x="458" y="304" font-size="12" fill="#fff" font-weight="700" opacity="1">0</text>
  <circle cx="616" cy="90" r="6" fill="#d9b44a"/>
  <text x="602" y="94" text-anchor="end" font-size="12" fill="#fff" font-weight="700" opacity="1">5</text>
  <circle cx="616" cy="120" r="6" fill="#d9b44a"/>
  <text x="602" y="124" text-anchor="end" font-size="12" fill="#fff" font-weight="400" opacity="0.6">6</text>
  <circle cx="616" cy="150" r="6" fill="#d9b44a"/>
  <text x="602" y="154" text-anchor="end" font-size="12" fill="#fff" font-weight="400" opacity="0.6">7</text>
  <circle cx="616" cy="180" r="6" fill="#d9b44a"/>
  <text x="602" y="184" text-anchor="end" font-size="12" fill="#fff" font-weight="400" opacity="0.6">8</text>
  <circle cx="616" cy="210" r="6" fill="#d9b44a"/>
  <text x="602" y="214" text-anchor="end" font-size="12" fill="#fff" font-weight="400" opacity="0.6">9</text>
  <circle cx="616" cy="240" r="6" fill="#d9b44a"/>
  <text x="602" y="244" text-anchor="end" font-size="12" fill="#fff" font-weight="700" opacity="1">10</text>
  <circle cx="616" cy="270" r="6" fill="#d9b44a"/>
  <text x="602" y="274" text-anchor="end" font-size="12" fill="#fff" font-weight="400" opacity="0.6">20</text>
  <circle cx="616" cy="300" r="6" fill="#d9b44a"/>
  <text x="602" y="304" text-anchor="end" font-size="12" fill="#fff" font-weight="400" opacity="0.6">21</text>
  <circle cx="444" cy="210" r="9" fill="none" stroke="#fff" stroke-dasharray="3 3" opacity=".7"/>
  <g fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M210 120 H444" stroke="#222222"/>
    <path d="M210 300 H270 V150 H444" stroke="#d62828"/>
    <path d="M210 270 H250 V45 H660 V90 H616" stroke="#2e9e4f"/>
    <path d="M210 240 H330 V180 H444" stroke="#2a7de1"/>
    <path d="M210 210 H370 V300 H444" stroke="#e67e22"/>
    <path d="M210 180 H290 V270 H444" stroke="#8e44ad"/>
    <path d="M210 150 H230 V30 H690 V240 H616" stroke="#e9a100"/>
    <path d="M210 330 H395 V210 H444" stroke="#888" stroke-dasharray="5 4" opacity=".7"/>
  </g>
  <g font-size="10" fill="#57606a" text-anchor="end">
    <text x="440" y="144">power (3.3 V)</text>
    <text x="440" y="114">ground</text>
    <text x="440" y="174">SPI data (MOSI)</text>
    <text x="440" y="264">data / command</text>
    <text x="440" y="294">reset</text>
  </g>
  <g font-size="10" fill="#57606a" text-anchor="middle">
    <text x="455" y="24">SPI clock</text><text x="455" y="39">chip select</text>
  </g>
  </g>
  <text x="370" y="448" text-anchor="middle" font-size="11" fill="#57606a">BLK (backlight) is optional: if your module has it, wire it to GPIO 3 (dashed) and enable -DTFT_BL=3 in platformio.ini.</text>
  <text x="370" y="466" text-anchor="middle" font-size="11" fill="#57606a">Pin order on display modules varies, so match by label. Board shown is the ESP32-C3 SuperMini (back side, as labeled), USB-C at the top.</text>
</svg>