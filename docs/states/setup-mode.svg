<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" font-family="Manrope,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>State: WiFi setup screen</title>
  <rect width="900" height="580" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="450" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">State: WiFi setup screen</text>
  <g transform="translate(0,10)"><circle cx="300" cy="290" r="250.0" fill="#8a929c"/><circle cx="300" cy="290" r="243.0" fill="#000"/><text x="300.0" y="192.1" text-anchor="middle" font-size="28.0" font-weight="500" fill="#808080" >Join this WiFi</text><text x="300.0" y="248.4" text-anchor="middle" font-size="40.0" font-weight="500" fill="#fff" >clk-setup-A1B2</text><text x="300.0" y="316.1" text-anchor="middle" font-size="28.0" font-weight="500" fill="#808080" >Password</text><text x="300.0" y="372.4" text-anchor="middle" font-size="40.0" font-weight="500" fill="#fff" >48213906</text><text x="300.0" y="444.1" text-anchor="middle" font-size="28.0" font-weight="500" fill="#808080" >then open 192.168.4.1</text></g>
  <text x="590" y="140" font-size="14" fill="#1f2328" font-weight="700">Setup mode</text><text x="590" y="160" font-size="14" fill="#57606a" font-weight="400">Shown on first boot, after 20 s without WiFi, or after</text><text x="590" y="180" font-size="14" fill="#57606a" font-weight="400">holding BOOT for 3 s. Join the clock's own network,</text><text x="590" y="200" font-size="14" fill="#57606a" font-weight="400">then open the address to enter WiFi, timezone, ZIP</text><text x="590" y="220" font-size="14" fill="#57606a" font-weight="400">and display options. SSID suffix and password vary.</text><text x="590" y="254" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#0891b2">ui_show_setup(ssid, pass, ip)</text>
  <text x="450" y="566" text-anchor="middle" font-size="11" fill="#57606a">The SSID suffix is the last two MAC bytes; the password is random per session. Values shown are examples.</text>
</svg>
