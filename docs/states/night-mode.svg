<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" font-family="Manrope,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>State: night mode</title>
  <rect width="900" height="580" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="450" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">State: night mode</text>
  <g transform="translate(0,10)"><circle cx="300" cy="290" r="250.0" fill="#8a929c"/><circle cx="300" cy="290" r="243.0" fill="#000"/><text x="300" y="180.4" text-anchor="middle" font-size="40.0" font-weight="500"><tspan fill="#D01818">Tue</tspan><tspan dx="12" fill="#901010">Nov 23</tspan></text><text x="300.0" y="330.3" text-anchor="middle" font-size="112.0" font-weight="500" fill="#D01818" letter-spacing="-2">10:47</text><text x="460.0" y="330.0" text-anchor="start" font-size="28.0" font-weight="500" fill="#901010" >AM</text><g fill="#C01515" stroke="#C01515" stroke-linecap="round" transform="translate(230,384) scale(1.0)"><circle cx="22" cy="24" r="12" stroke="none"/><path d="M22 4V0M22 44V48M2 24H-2M42 24H46M8 10L5 7M36 10L39 7" stroke-width="3.5"/><ellipse cx="34" cy="44" rx="22" ry="12" stroke="none"/><circle cx="24" cy="38" r="10" stroke="none"/><circle cx="40" cy="34" r="12" stroke="none"/></g><text x="306.0" y="428.4" font-size="40" font-weight="500" fill="#C01515">61°</text></g>
  <text x="590" y="140" font-size="14" fill="#1f2328" font-weight="700">Night mode</text><text x="590" y="160" font-size="14" fill="#57606a" font-weight="400">After sunset (from the weather feed's is_day) everything</text><text x="590" y="180" font-size="14" fill="#57606a" font-weight="400">turns dim red; the seconds ring and range bar fade to</text><text x="590" y="200" font-size="14" fill="#57606a" font-weight="400">black so nothing moves. It cross-fades over ~45 s.</text><text x="590" y="234" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#0891b2">ui_set_night(true)</text>
  <text x="450" y="566" text-anchor="middle" font-size="11" fill="#57606a">Drawn at 2x from the 240×240 display layout in src/ui.cpp; animated states show one frame.</text>
</svg>
