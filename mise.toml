[tools]
uv = "latest"
# PlatformIO CLI; it manages its own toolchains/penv under ~/.platformio
"pipx:platformio" = "6.2.0"
# Only needed for regenerating fonts with `npx lv_font_conv` (see CLAUDE.md)
node = "lts"

[tasks.build]
description = "Build the firmware"
run = "pio run"

[tasks.upload]
description = "Build and flash the board"
run = "pio run -t upload"

[tasks.clean]
description = "Clean build output"
run = "pio run -t clean"

[tasks.render]
description = "Render every face on this computer into docs/faces/ (needs one prior build)"
run = "sh docs/tools/sim/render.sh"

[tasks.check]
description = "Check that the docs match the code (paths, functions, faces, web flasher palettes)"
run = "python3 docs/tools/check.py"
