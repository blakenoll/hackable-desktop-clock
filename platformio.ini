[env:lolin_c3_mini]
platform = espressif32
board = lolin_c3_mini
framework = arduino
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; --- LVGL ---
  -DLV_CONF_INCLUDE_SIMPLE
  -Iinclude
  ; --- TFT_eSPI config (no need to edit the library's User_Setup.h) ---
  -DUSER_SETUP_LOADED=1
  -DGC9A01_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=240
  -DTFT_MOSI=4
  -DTFT_SCLK=10
  -DTFT_CS=5
  -DTFT_DC=1
  -DTFT_RST=0
  -DTFT_BL=3
  -DTFT_BACKLIGHT_ON=HIGH
  -DSPI_FREQUENCY=40000000
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DSMOOTH_FONT=1
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  lvgl/lvgl@^9.2.2
