[env:lolin_c3_mini]
; Versions are pinned to what this project was built and tested with. fix_tft.py depends on
; Arduino core 2.x (platform 6.10.0); a newer platform can break it. See docs/HARDWARE.md before bumping.
platform = espressif32@6.10.0
board = lolin_c3_mini
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv  ; ~3 MB app, no OTA slot (unused here)
extra_scripts = pre:fix_tft.py
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; --- LVGL ---
  -DLV_CONF_INCLUDE_SIMPLE
  -Iinclude
  ; --- TFT_eSPI config (no need to edit the library's User_Setup.h) ---
  -DUSER_SETUP_LOADED=1
  -DGC9A01_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=240
  -DTFT_MOSI=4
  -DTFT_SCLK=10
  -DTFT_CS=5
  -DTFT_DC=1
  -DTFT_RST=0
  ; Backlight pin is optional: uncomment both lines if your module has a BLK pin.
  ; -DTFT_BL=3
  ; -DTFT_BACKLIGHT_ON=HIGH
  -DSPI_FREQUENCY=40000000
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DSMOOTH_FONT=1
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  lvgl/lvgl@9.6.0
